# Задание 6 (повышенной сложности): GitHub Actions для проверки Python-кода.
# Запускается при каждом push в main/feature и при pull request в main.
name: Python check

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository (с подмодулями)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Check syntax (py_compile)
        run: python -m py_compile main.py feature.py test_main.py

      - name: Run tests with pytest
        run: pytest -v
